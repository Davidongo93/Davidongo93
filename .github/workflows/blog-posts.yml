# Keeps "Latest from the blog" in sync with the daev.space RSS feed.
name: Latest blog posts

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://daev.space/rss.xml'
          max_post_count: 4
          commit_message: 'chore: update latest blog posts'
